<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La mia spesa</title><style>body{font-family:-apple-system,system-ui;margin:0;background:#f5f6f8;color:#20242b}main{max-width:680px;margin:auto;padding:18px}h1{font-size:26px}button,input,select{font:inherit}button{padding:10px 14px;border:1px solid #ccd1da;border-radius:10px;background:white}button.active{background:#d9ebff}.bar{display:flex;gap:8px;flex-wrap:wrap}.box{background:white;border-radius:14px;margin:14px 0;overflow:hidden;border:1px solid #ddd}.heading{background:#e9edf2;padding:13px;font-weight:bold;display:flex;align-items:center;gap:8px}.heading>span{flex:1}.heading .zone-add{padding:3px 10px;font-size:22px;line-height:1.2;cursor:pointer}.inline-add{display:flex;gap:8px;align-items:center;padding:10px 13px;border-top:1px solid #eee}.inline-add input{flex:1;min-width:0;padding:10px;border:1px solid #ccd1da;border-radius:9px}.inline-add button{font-weight:bold;font-size:20px;padding:7px 13px}.row{display:flex;align-items:center;gap:12px;padding:13px;border-top:1px solid #eee}.row input{width:22px;height:22px}.row.done{opacity:.45;text-decoration:line-through}.row span{flex:1}.grip{touch-action:none;cursor:grab;flex:1;align-self:stretch;min-width:45px;display:flex;align-items:center;justify-content:flex-end;user-select:none;-webkit-user-select:none}.row span{flex:0 1 auto}.row .grip{margin-left:auto}.heading .grip{margin-left:auto}form{background:white;padding:12px;border-radius:12px;margin-top:12px}form input,form select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0}small{color:#666}#edit{display:none}.grip{flex:0 0 36px!important;min-width:36px!important;justify-content:center!important;font-size:23px;color:#596575}.dragging-item{opacity:.55;background:#d9ebff!important;outline:2px solid #2878d0}.drop-before{box-shadow:inset 0 4px #2878d0}.drop-after{box-shadow:inset 0 -4px #2878d0}.editable{cursor:text}.rename-input{min-width:0;width:100%;padding:8px;border:2px solid #2878d0;border-radius:7px}.rename-controls{display:flex;gap:4px}.rename-controls button{padding:5px 9px}.heading .editable{flex:1}.version-stamp{font-size:12px;color:#64748b;margin:-10px 0 12px}</style></head><body><main><h1>🛒 La mia spesa</h1><div class="version-stamp" id="versionStamp"></div><div class="bar"><button id="shopTab" class="active">Spesa</button><button id="editTab">⚙️ Configura</button></div><section id="shop"><p id="counter"></p><div id="shopList"></div><button id="clear">Nascondi acquistati</button></section><section id="edit"><p><small>Trascina ☰ per riordinare. Tocca un nome per modificarlo.</small></p><div class="bar"><button id="addProduct">+ Prodotto</button><button id="addZone">+ Reparto</button><button id="backup">Esporta backup</button><label style="padding:10px;border:1px solid #ccc;border-radius:10px;background:white">Importa backup<input id="restore" type="file" accept=".json" hidden></label></div><form id="productForm" hidden><input id="productName" placeholder="Nome prodotto" required maxlength="60"><select id="productZone"></select><button>Aggiungi prodotto</button></form><form id="zoneForm" hidden><input id="zoneName" placeholder="Nome reparto" required maxlength="45"><button>Aggiungi reparto</button></form><div id="editList"></div></section><p><small>I dati vengono salvati automaticamente in questo browser. Esporta periodicamente un backup.</small></p></main><script>
(()=>{'use strict';const buildTime='2026-10-22T22:27:37.472Z';document.getElementById('versionStamp').textContent='Versione pubblicata nel codice: '+new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(buildTime))+' (ora italiana)';const key='lista-spesa-v1';let initial={zones:[{id:1,name:'Frutta e verdura'},{id:2,name:'Pane'},{id:3,name:'Dispensa'},{id:4,name:'Frigoriferi'}],products:[{id:1,name:'Pere',z:1,on:true,done:false},{id:2,name:'Insalata',z:1,on:true,done:false},{id:3,name:'Pomodori',z:1,on:false,done:false},{id:4,name:'Pane',z:2,on:true,done:false},{id:5,name:'Pasta',z:3,on:true,done:false},{id:6,name:'Latte',z:4,on:true,done:false}]};let state;try{state=JSON.parse(localStorage.getItem(key))||initial}catch{state=initial}const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(state));function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}let mode='shop',addingZone=null;function render(){save();$('shop').style.display=mode==='shop'?'block':'none';$('edit').style.display=mode==='edit'?'block':'none';$('shopTab').classList.toggle('active',mode==='shop');$('editTab').classList.toggle('active',mode==='edit');$('counter').textContent=state.products.filter(p=>p.on&&!p.done).length+' da comprare · '+state.products.filter(p=>p.on&&p.done).length+' acquistati';for(let editing of [false,true]){let parent=$(editing?'editList':'shopList');parent.replaceChildren();for(let z of state.zones){let items=state.products.filter(p=>p.z===z.id&&(editing||p.on));if(!editing&&!items.length)continue;if(!editing)items.sort((a,b)=>Number(a.done)-Number(b.done));let box=el('div',undefined,'box'),header=el('div',undefined,'heading');header.append(editing?editable(z,'zone'):el('span',z.name));if(editing)header.append(grip('zone',z.id,z.name));if(editing){let add=el('button','+','zone-add');add.type='button';add.setAttribute('aria-label','Aggiungi prodotto a '+z.name);add.onclick=()=>{addingZone=addingZone===z.id?null:z.id;render();if(addingZone!==null)document.querySelector('.inline-add input')?.focus()};header.append(add)}box.append(header);if(editing&&addingZone===z.id){let form=el('form',undefined,'inline-add'),input=el('input'),confirm=el('button','✓');input.placeholder='Nome nuovo prodotto';input.required=true;input.maxLength=60;input.setAttribute('aria-label','Nome prodotto per '+z.name);confirm.type='submit';confirm.setAttribute('aria-label','Conferma nuovo prodotto');let cancel=el('button','✕');cancel.type='button';cancel.setAttribute('aria-label','Annulla inserimento');cancel.onclick=()=>{addingZone=null;render()};form.append(input,confirm,cancel);form.onsubmit=e=>{e.preventDefault();let name=input.value.trim();if(!name)return;state.products.unshift({id:Math.max(0,...state.products.map(p=>p.id))+1,name,z:z.id,on:true,done:false});addingZone=null;render()};box.append(form)}for(let p of items){let row=el('div',undefined,'row'+(!editing&&p.done?' done':''));let cb=el('input');cb.type='checkbox';cb.checked=editing?p.on:p.done;cb.setAttribute('aria-label',p.name);cb.onchange=()=>{if(editing){p.on=cb.checked;p.done=false}else p.done=cb.checked;render()};row.append(cb,editing?editable(p,'product'):el('span',p.name));if(editing)row.append(grip('product',p.id,p.name));box.append(row)}parent.append(box)}}let select=$('productZone'),old=select.value;select.replaceChildren();for(let z of state.zones){let option=el('option',z.name);option.value=z.id;select.append(option)}if([...select.options].some(o=>o.value===old))select.value=old}function editable(item,type){let label=el('span',item.name,'editable');label.onclick=()=>{let wrap=el('div',undefined,'rename-controls'),input=el('input'),ok=el('button','✓'),cancel=el('button','✕');input.className='rename-input';input.value=item.name;input.maxLength=type==='zone'?45:60;ok.type=cancel.type='button';ok.setAttribute('aria-label','Conferma');cancel.setAttribute('aria-label','Annulla');wrap.append(input,ok,cancel);label.replaceWith(wrap);input.focus();input.select();ok.onclick=()=>{let name=input.value.trim();if(name)item.name=name;render()};cancel.onclick=()=>render();input.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')cancel.click()}};return label}
let dragging=null,hover=null;
function grip(type,id,label){let btn=el('div','☰','grip');btn.setAttribute('role','button');btn.tabIndex=0;btn.setAttribute('aria-label','Sposta '+label);btn.dataset.grip='1';btn.dataset.type=type;btn.dataset.id=id;btn.draggable=true;
btn.ondragstart=e=>{start(type,id,btn);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id))};btn.ondragend=cleanup;
btn.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;e.preventDefault();start(type,id,btn);btn.setPointerCapture(e.pointerId)});
btn.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||!dragging)return;e.preventDefault();mark(e.clientX,e.clientY)});
btn.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'||!dragging)return;mark(e.clientX,e.clientY);commit()});btn.addEventListener('pointercancel',cleanup);return btn}
function start(type,id,btn){cleanup();dragging={type,id};btn.closest(type==='zone'?'.box':'.row')?.classList.add('dragging-item')}
function cleanup(){document.querySelectorAll('.dragging-item,.drop-before,.drop-after').forEach(n=>n.classList.remove('dragging-item','drop-before','drop-after'));dragging=null;hover=null}
function mark(x,y){if(!dragging)return;document.querySelectorAll('.drop-before,.drop-after').forEach(n=>n.classList.remove('drop-before','drop-after'));hover=null;let node=document.elementFromPoint(x,y)?.closest(dragging.type==='zone'?'.box':'.row');if(!node)return;let handle=dragging.type==='zone'?node.querySelector('.heading [data-grip]'):node.querySelector('[data-grip]');if(!handle||handle.dataset.type!==dragging.type||Number(handle.dataset.id)===dragging.id)return;
if(dragging.type==='product'){let src=state.products.find(p=>p.id===dragging.id),dst=state.products.find(p=>p.id===Number(handle.dataset.id));if(!src||!dst||src.z!==dst.z)return}
let after=y>node.getBoundingClientRect().top+node.getBoundingClientRect().height/2;node.classList.add(after?'drop-after':'drop-before');hover={id:Number(handle.dataset.id),after}}
function commit(){if(!dragging||!hover){cleanup();return}let arr=dragging.type==='zone'?state.zones:state.products;let from=arr.findIndex(x=>x.id===dragging.id);if(from<0){cleanup();return}let item=arr.splice(from,1)[0],to=arr.findIndex(x=>x.id===hover.id);arr.splice(to+(hover.after?1:0),0,item);cleanup();render()}
document.addEventListener('dragover',e=>{if(dragging){e.preventDefault();mark(e.clientX,e.clientY)}});document.addEventListener('drop',e=>{if(dragging){e.preventDefault();mark(e.clientX,e.clientY);commit()}});
$('shopTab').onclick=()=>{mode='shop';render()};$('editTab').onclick=()=>{mode='edit';render()};$('clear').onclick=()=>{state.products.filter(p=>p.on&&p.done).forEach(p=>{p.on=false;p.done=false});render()};$('addProduct').onclick=()=>{$('productForm').hidden=!$('productForm').hidden;$('zoneForm').hidden=true};$('addZone').onclick=()=>{$('zoneForm').hidden=!$('zoneForm').hidden;$('productForm').hidden=true};$('productForm').onsubmit=e=>{e.preventDefault();let name=$('productName').value.trim();if(!name)return;state.products.push({id:Math.max(0,...state.products.map(p=>p.id))+1,name,z:Number($('productZone').value),on:true,done:false});$('productName').value='';$('productForm').hidden=true;render()};$('zoneForm').onsubmit=e=>{e.preventDefault();let name=$('zoneName').value.trim();if(!name)return;state.zones.push({id:Math.max(0,...state.zones.map(z=>z.id))+1,name});$('zoneName').value='';$('zoneForm').hidden=true;render()};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=el('a');a.href=URL.createObjectURL(blob);a.download='backup-lista-spesa.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.zones)||!Array.isArray(data.products))throw Error('Formato non valido');state=data;render();alert('Backup importato')}catch(err){alert('Impossibile importare: '+err.message)}};render()})();
</script></body></html>
