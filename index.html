<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La mia spesa</title><style>body{font-family:-apple-system,system-ui;margin:0;background:#f5f6f8;color:#20242b}main{max-width:680px;margin:auto;padding:18px}h1{font-size:26px}button,input,select{font:inherit}button{padding:10px 14px;border:1px solid #ccd1da;border-radius:10px;background:white}button.active{background:#d9ebff}.bar{display:flex;gap:8px;flex-wrap:wrap}.box{background:white;border-radius:14px;margin:14px 0;overflow:hidden;border:1px solid #ddd}.heading{background:#e9edf2;padding:13px;font-weight:bold}.row{display:flex;align-items:center;gap:12px;padding:13px;border-top:1px solid #eee}.row input{width:22px;height:22px}.row.done{opacity:.45;text-decoration:line-through}.row span{flex:1}.grip{touch-action:none;cursor:grab}form{background:white;padding:12px;border-radius:12px;margin-top:12px}form input,form select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0}small{color:#666}#edit{display:none}</style></head><body><main><h1>🛒 La mia spesa</h1><div class="bar"><button id="shopTab" class="active">Spesa</button><button id="editTab">⚙️ Configura</button></div><section id="shop"><p id="counter"></p><div id="shopList"></div><button id="clear">Nascondi acquistati</button></section><section id="edit"><p><small>Trascina ☰ per riordinare reparti e prodotti.</small></p><div class="bar"><button id="addProduct">+ Prodotto</button><button id="addZone">+ Reparto</button><button id="backup">Esporta backup</button><label style="padding:10px;border:1px solid #ccc;border-radius:10px;background:white">Importa backup<input id="restore" type="file" accept=".json" hidden></label></div><form id="productForm" hidden><input id="productName" placeholder="Nome prodotto" required maxlength="60"><select id="productZone"></select><button>Aggiungi prodotto</button></form><form id="zoneForm" hidden><input id="zoneName" placeholder="Nome reparto" required maxlength="45"><button>Aggiungi reparto</button></form><div id="editList"></div></section><p><small>I dati vengono salvati automaticamente in questo browser. Esporta periodicamente un backup.</small></p></main><script>
(()=>{'use strict';const key='lista-spesa-v1';let initial={zones:[{id:1,name:'Frutta e verdura'},{id:2,name:'Pane'},{id:3,name:'Dispensa'},{id:4,name:'Frigoriferi'}],products:[{id:1,name:'Pere',z:1,on:true,done:false},{id:2,name:'Insalata',z:1,on:true,done:false},{id:3,name:'Pomodori',z:1,on:false,done:false},{id:4,name:'Pane',z:2,on:true,done:false},{id:5,name:'Pasta',z:3,on:true,done:false},{id:6,name:'Latte',z:4,on:true,done:false}]};let state;try{state=JSON.parse(localStorage.getItem(key))||initial}catch{state=initial}const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(state));function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}let mode='shop';function render(){save();$('shop').style.display=mode==='shop'?'block':'none';$('edit').style.display=mode==='edit'?'block':'none';$('shopTab').classList.toggle('active',mode==='shop');$('editTab').classList.toggle('active',mode==='edit');$('counter').textContent=state.products.filter(p=>p.on&&!p.done).length+' da comprare · '+state.products.filter(p=>p.on&&p.done).length+' acquistati';for(let editing of [false,true]){let parent=$(editing?'editList':'shopList');parent.replaceChildren();for(let z of state.zones){let items=state.products.filter(p=>p.z===z.id&&(editing||p.on));if(!editing&&!items.length)continue;if(!editing)items.sort((a,b)=>Number(a.done)-Number(b.done));let box=el('div',undefined,'box'),header=el('div',undefined,'heading');if(editing)header.append(grip('zone',z.id,z.name));header.append(el('span',z.name));box.append(header);for(let p of items){let row=el('div',undefined,'row'+(!editing&&p.done?' done':''));if(editing)row.append(grip('product',p.id,p.name));let cb=el('input');cb.type='checkbox';cb.checked=editing?p.on:p.done;cb.setAttribute('aria-label',p.name);cb.onchange=()=>{if(editing){p.on=cb.checked;p.done=false}else p.done=cb.checked;render()};row.append(cb,el('span',p.name));box.append(row)}parent.append(box)}}let select=$('productZone'),old=select.value;select.replaceChildren();for(let z of state.zones){let option=el('option',z.name);option.value=z.id;select.append(option)}if([...select.options].some(o=>o.value===old))select.value=old}let dragging=null;function grip(type,id,label){let btn=el('button','☰','grip');btn.type='button';btn.setAttribute('aria-label','Trascina '+label);btn.draggable=true;btn.ondragstart=e=>{dragging={type,id};e.dataTransfer.setData('text/plain',String(id))};btn.ondragover=e=>e.preventDefault();btn.ondrop=e=>{e.preventDefault();drop(type,id)};btn.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;dragging={type,id};btn.setPointerCapture(e.pointerId)});btn.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'||!dragging)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-grip]');if(target)drop(target.dataset.type,Number(target.dataset.id));dragging=null});btn.dataset.grip='1';btn.dataset.type=type;btn.dataset.id=id;return btn}function drop(type,target){if(!dragging||dragging.type!==type)return;let arr=type==='zone'?state.zones:state.products,a=arr.findIndex(x=>x.id===dragging.id),b=arr.findIndex(x=>x.id===target);if(a<0||b<0||a===b)return;if(type==='product'&&arr[a].z!==arr[b].z)return;arr.splice(b,0,arr.splice(a,1)[0]);dragging=null;render()}$('shopTab').onclick=()=>{mode='shop';render()};$('editTab').onclick=()=>{mode='edit';render()};$('clear').onclick=()=>{state.products.filter(p=>p.on&&p.done).forEach(p=>{p.on=false;p.done=false});render()};$('addProduct').onclick=()=>{$('productForm').hidden=!$('productForm').hidden;$('zoneForm').hidden=true};$('addZone').onclick=()=>{$('zoneForm').hidden=!$('zoneForm').hidden;$('productForm').hidden=true};$('productForm').onsubmit=e=>{e.preventDefault();let name=$('productName').value.trim();if(!name)return;state.products.push({id:Math.max(0,...state.products.map(p=>p.id))+1,name,z:Number($('productZone').value),on:true,done:false});$('productName').value='';$('productForm').hidden=true;render()};$('zoneForm').onsubmit=e=>{e.preventDefault();let name=$('zoneName').value.trim();if(!name)return;state.zones.push({id:Math.max(0,...state.zones.map(z=>z.id))+1,name});$('zoneName').value='';$('zoneForm').hidden=true;render()};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=el('a');a.href=URL.createObjectURL(blob);a.download='backup-lista-spesa.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.zones)||!Array.isArray(data.products))throw Error('Formato non valido');state=data;render();alert('Backup importato')}catch(err){alert('Impossibile importare: '+err.message)}};render()})();
</script></body></html>
